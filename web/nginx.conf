server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # THE SPA FALLBACK, AND IT IS NOT OPTIONAL HERE. react-router owns paths
    # like /checkout/return, /contracts/:id and /settings/payouts that have no
    # file behind them. Without this, the very first thing a payer does after
    # paying — being redirected by FedaPay to /checkout/return?intent=... — is
    # a 404, and the escrow never settles from the return page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # hard and forever: a changed file is a changed name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a returning browser keeps loading the
    # old bundle after a deploy and asks for asset filenames that no longer
    # exist. This is the difference between "deployed" and "deployed for
    # people who hard-refresh".
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
