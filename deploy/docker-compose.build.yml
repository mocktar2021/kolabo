# Build the two app images on this box instead of pulling them from ghcr.io.
#
# HOW IT IS TURNED ON: KOLABO_BUILD=1 in deploy/.env. up.sh reads that and
# adds this file as a second -f, then passes --build. A box without the setting
# never loads this file and pulls the tag named by KOLABO_TAG.
#
# WHY IT EXISTS. docker-compose.prod.yml names images that CI builds, which is
# what gives production a rollback. The dev box cannot use those images: the
# web bundle has its api hostname and its environment compiled in, so
# production's web image served from the dev box would point that box's
# visitors at production's api, and the development banner would be missing.
# So the dev box keeps building, and these are the sections it needs.
#
# WHY A TRACKED FILE RATHER THAN THE GITIGNORED docker-compose.local.yml. The
# three build args below have to agree with web/Dockerfile and with the CI
# workflow, and a copy of them living only on one server is a copy nobody
# reviews and nobody notices going stale. docker-compose.local.yml stays for
# what is genuinely per box, which is that server's shared caddy network.
#
# THE BUILT IMAGE TAKES THE NAME AND TAG FROM docker-compose.prod.yml, so a
# building box still needs KOLABO_TAG set. KOLABO_TAG=dev is the usual value:
# it never gets pushed anywhere, it just gives the local image a name.
services:
  backend:
    build: ../backend

  sweeps:
    build: ../backend

  web:
    build:
      context: ../web
      args:
        # Baked into the bundle at build time, see web/Dockerfile. Changing
        # this requires a rebuild, not a restart.
        VITE_API_URL: ${VITE_API_URL}
        # Same rule, and the one place it is easiest to get wrong. This has to
        # be a BUILD ARG and not an `environment:` entry: the web service is
        # nginx serving static files, so it has no process that reads its
        # environment at all. A value put under `environment:` here would be
        # accepted by compose, set on a container nothing reads it from, and
        # the button would simply never appear, with nothing anywhere saying
        # why.
        #
        # Empty is a supported state and means the Google button is absent.
        # That is the intended configuration until the OAuth client ids exist,
        # and it matches the backend, whose GOOGLE_CLIENT_IDS being empty makes
        # POST /auth/google answer 503.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Fed from the ENV this file already requires, rather than from a
        # second variable of its own. A box that declared itself development
        # for the backend and production for the web app would be telling two
        # different stories about the same deployment, and the whole point of
        # the banner is that it agrees with reality.
        #
        # No `:-` default on purpose. An unset ENV reaches the bundle as a
        # value that is not "production", so the banner appears, which is the
        # right way to fail. checks/preflight-env.sh refuses an empty ENV
        # anyway, well before this is reached.
        #
        # ONE SUBTLETY IF THE BANNER APPEARS ON PRODUCTION. Compose resolves
        # ${...} from the shell environment BEFORE this file's .env, and ENV
        # is a name some shells set for their own rc file. If a production
        # build shows the banner and deploy/.env says production, check
        # `echo $ENV` in the deploying shell before suspecting anything here.
        VITE_KOLABO_ENV: ${ENV}
