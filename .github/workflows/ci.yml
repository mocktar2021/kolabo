name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci`, not `npm install`. install RESOLVES the ranges in
      # package.json afresh on every run, so each build got a slightly
      # different dependency tree and "green" described a tree that existed
      # for the length of one job. ci installs package-lock.json exactly, and
      # refuses outright when the lockfile and package.json disagree rather
      # than quietly reconciling them, so a dependency change has to arrive as
      # a reviewable diff instead of as weather.
      - run: npm ci
      - run: npm run build
      # After the build, so a type error is reported as a type error rather
      # than as a wall of failing tests. Vitest reads the project's own Vite
      # config, so there is no second toolchain to keep in step with this one.
      - run: npm run test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Same change and the same reason as the web job above. It matters a
      # little more here: this is the tree an `eas build` installs from too,
      # so an unpinned mobile dependency is a difference between what CI
      # checked and what ends up on a phone.
      - run: npm ci
      # The mobile app has no simulator in CI, so on-device behaviour is
      # verified manually in Expo Go; what this guards is that the TypeScript
      # across screens, navigation and the API layer stays sound.
      - run: npx tsc --noEmit
      # After the type-check, for the same reason the web job runs its tests
      # last. These read backend/app/**.py to check that no refusal and no
      # notification the backend can send is missing a French or an English
      # sentence — a seam `tsc` cannot see across, because its far side is
      # Python. actions/checkout has already put that tree on disk.
      - run: npm run test

  # ---------------------------------------------------------------- publish
  #
  # KOL-56. Build the two deployable images once, here, and push them to
  # GitHub's own registry so the production box can pull a known artifact
  # instead of building one.
  #
  # WHAT THIS BUYS, AND IT IS NOT BUILD SPEED. Today `up.sh` builds on the
  # server, so there is no image anywhere and therefore no rollback: the
  # previous version of the web app exists only as a git commit that has to be
  # rebuilt on the box to get back to. A tagged image turns a bad deploy from
  # an incident into one edited line and a restart. deploy/README.md has said
  # this was the fix since the day it recorded the problem.
  #
  # IT DOES NOT CHANGE ANY DEPLOY YET, deliberately. The compose file still
  # says `build:`, so nothing on either box behaves differently until a second
  # change switches it to `image:`. Shipping it this way round means there are
  # already published images to pull when that switch lands, rather than a
  # deploy that fails because the tag it wants has never been built.
  #
  # ONLY ON main. A pull request gets the three test jobs above and no
  # publish: a registry full of images for branches nobody merged is a bill
  # and a haystack.
  #
  # NEEDS THE TESTS TO PASS FIRST. An image that failed CI must never be
  # pullable, because the whole point of a tag is that somebody can deploy it
  # without re-reading what is in it.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, web, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only non-default permission, and it is what lets GITHUB_TOKEN push
      # to ghcr.io. No account, no personal access token and no secret to
      # rotate: the token is minted per run and expires with it.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TWO TAGS, AND THE SHA IS THE REAL ONE. `main` is a convenience for
      # "whatever is newest"; the sha tag is what deploy/.env pins and what a
      # rollback names. A deployment pinned to `main` would move under the box
      # on the next merge, which is the behaviour this ticket exists to end.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kolabo-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kolabo-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE WEB IMAGE IS ENVIRONMENT SPECIFIC AND THAT IS UNAVOIDABLE HERE.
      # Vite inlines these three at build time, so the bundle is compiled
      # against one API hostname and one environment. The image published
      # here is therefore the PRODUCTION web image and must not be run on the
      # dev box; the dev box keeps building its own, which is what
      # KOLABO_BUILD=1 and deploy/docker-compose.build.yml are for. That was
      # docker-compose.local.yml when this job was written, and the gitignored
      # per box file turned out to be the wrong home for three build args that
      # have to agree with web/Dockerfile and with this workflow.
      #
      # NONE OF THESE THREE IS A SECRET. All three are inlined into the
      # JavaScript every visitor downloads, so they are repository variables
      # rather than secrets: putting them in `secrets` would imply a
      # confidentiality that the shipped bundle does not have, and would mean
      # a masked value in the build log for no benefit.
      #
      # VITE_KOLABO_ENV IS HARDCODED to production rather than read from a
      # variable. This image exists to be deployed to production; an image
      # built here carrying any other value would be one that shows the
      # development banner to real brands, and there is no case where that is
      # wanted. The dev box builds its own with its own value.

      # REFUSE RATHER THAN PUBLISH A BROKEN IMAGE. An unset repository
      # variable is an empty string, not an error, so without this the first
      # run after merge would cheerfully build a web bundle whose API base is
      # "" and push it under a tag that looks deployable. Nobody would find
      # out until a brand opened the site and every request went nowhere.
      #
      # ONLY ONE VARIABLE CAN FAIL THIS, and the comment here used to say
      # two. The API base is the one with no sane empty value: a bundle
      # compiled against "" reaches no backend at all. An empty Google
      # client id is a supported state meaning the button is absent, and the
      # environment is hardcoded above, so neither of those can stop a
      # publish and only the first is checked.
      #
      # Failing here costs a red run on main and nothing else: no deploy
      # reads these images yet, and the three test jobs above have already
      # passed, so a failure in this job says exactly one thing, which is
      # that PROD_VITE_API_URL is not set.
      # CHECKS THE SHAPE, NOT ONLY THE PRESENCE, because presence was all it
      # checked on 5 November and a trailing slash took production's write
      # paths down for an afternoon. The value became
      # "https://api.kolaboafrica.com/", web/src/lib/api.ts builds
      # `${BASE}${path}` where every path already starts with "/", and the
      # doubled slash answered 200 on a GET and 404 on a POST. The site looked
      # healthy while no login, registration, reset or checkout worked.
      #
      # deploy/checks/preflight-env.sh has refused this exact shape on
      # VITE_API_URL for months. Moving the build into CI moved the value out
      # from behind that check without bringing the rule along. This is the
      # rule, brought along.
      #
      # READ THROUGH env RATHER THAN INTERPOLATED INTO THE SCRIPT. A ${{ }}
      # expansion is pasted into the shell before bash sees it, so a value
      # containing a quote or a backtick would run as a command. Through env
      # it is only ever data.
      - name: The web build needs production's API base
        env:
          API_BASE: ${{ vars.PROD_VITE_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.PROD_VITE_GOOGLE_CLIENT_ID }}
        run: |
          fail() {
            echo "::error::$1 Set it under Settings, Secrets and variables, Actions, Variables. It is inlined into the public bundle, so it is a variable rather than a secret."
            exit 1
          }
          [ -n "$API_BASE" ] || fail "PROD_VITE_API_URL is not set."
          case "$API_BASE" in
            https://*) ;;
            *) fail "PROD_VITE_API_URL must start with https://, and is '$API_BASE'." ;;
          esac
          case "$API_BASE" in
            */) fail "PROD_VITE_API_URL must not end with a slash, and is '$API_BASE'. Every request would be built with a doubled slash, which answers 404 on a POST." ;;
          esac
          case "${API_BASE#https://}" in
            */*) fail "PROD_VITE_API_URL must be scheme and host only, with no path, and is '$API_BASE'." ;;
          esac
          echo "PROD_VITE_API_URL is set and well formed: $API_BASE"
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::notice::PROD_VITE_GOOGLE_CLIENT_ID is empty, so the Google button will be absent. That is a supported state and matches the backend when GOOGLE_CLIENT_IDS is unset."
          fi

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PROD_VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.PROD_VITE_GOOGLE_CLIENT_ID }}
            VITE_KOLABO_ENV=production
          tags: |
            ghcr.io/${{ github.repository_owner }}/kolabo-web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kolabo-web:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE TAG TO DEPLOY, PRINTED WHERE SOMEBODY WILL SEE IT. Without this
      # line, using the feature means going to the Actions tab, opening a run
      # and copying a forty character sha out of a log. The summary puts it on
      # the run's front page with the two commands beside it.
      - name: Say how to deploy it
        run: |
          {
            echo "## Deployable tag"
            echo
            echo '```'
            echo "KOLABO_TAG=sha-${{ github.sha }}"
            echo '```'
            echo
            echo "Put that in \`deploy/.env\` on the production box, then:"
            echo
            echo '```'
            echo "cd ~/kolabo/deploy && bash up.sh"
            echo '```'
            echo
            echo "To roll back, set KOLABO_TAG to an earlier sha and run the same command."
          } >> "$GITHUB_STEP_SUMMARY"
